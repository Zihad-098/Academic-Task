<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
</head>

<body>
    <h1>My feedback form</h1>
    <form>
        <ul>
            <li>Name: <input type="text" name="" id=""></li>
            <li>Email: <input type="text" name="" id=""></li>
            <li>Password: <input type="text" name="" id=""></li>
        </ul>
        
        <ul>
            <li>please check all the emotions that apply to you:
                <ul>
                    <li>
                        <label>Angry</label>
                        <input type="checkbox">
                    </li>
                    <li>
                        <label>Sad</label>
                        <input type="checkbox">
                    </li>
                    <li>
                        <label>Happy</label>
                        <input type="checkbox">
                    </li>
                    <li>
                        <label>Ambivalent</label>
                        <input type="checkbox">
                    </li>
                </ul>
            </li>
        </ul>
        <ul>
            <li>
                How satisfied were you with our service?
                <ul>
                    <li>
                        <label>Very satisfied</label>
                        <input type="radio">
                    </li>
                    <li>
                        <label>Satisfied</label>
                        <input type="radio">
                    </li>
                    <li>
                        <label>Didn't care</label>
                        <input type="radio">
                    </li>
                    <li>
                        <label>Dissatisfied</label>
                        <input type="radio">
                    </li>
                    <li>
                        <label>Very dissatisfied</label>
                        <input type="radio">
                    </li>
                </ul>
            </li>
        </ul>
        <ul>
            <li>
                <label>Further comments:</label>
                <textarea name="" id="" rows="3" cols="20"></textarea>
            </li>
        </ul>
        <ul>
            <li>
                <label>Bio photo:</label>
                <input type="text">
                <button>choose...</button>
            </li>
            <li>
                <label>Location visited:</label>
                <select>
                    <option value="">Select location</option>
                    <option value="">Cumilla</option>
                    <option value="">Dhaka</option>
                    <option value="">Norshingdi</option>
                </select>
            </li>
        </ul>
        
    </form>
<ul>
    <li>
        <input type="submit">
    </li>
</ul>
        
    
</body>

</html>
