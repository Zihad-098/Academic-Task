<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel reservation form</title>
</head>
<body>
    <h1>Travel reservation form</h1>
    <h3>* denotes mandotory</h3>
    <form>
        <label>Full name*:</label><br>
        <input type="text" name="" id="" placeholder="FirstName LastName">
        <br>
        <label>Email address*:</label><br>
        <input type="text" name="" id="" placeholder="Email_address"><br>
        <label>Select Tour Package*:</label><br>
        <select name="" id="">
            <option value="">Goa</option>
            <option value="">Kashmir</option>
            <option value="">Rajasthan</option>
        </select><br>
        <label>Arrival date*:</label><br>
        <input type="date" name="" id=""><br>
        <label>What would you want to avail?*</label><br>
        <label>Boarding</label>
        <input type="checkbox"><br>
        <label>Fooding</label>
        <input type="checkbox"><br>
        <label>Sight seeing</label>
        <input type="checkbox">
        <br>
        <label>Discount Coupon code:</label><br>
        <input type="text" name="" id="" placeholder="Unknown_type"><br>
        <label>Terms and conditions*</label><br>
        <input type="radio" name="" id="">
        <label>I agree</label>
        <input type="radio" name="" id="">
        <label>I disagree</label><br>
        <input type="submit" name="" id="" value="Complete reservation">

    </form>
</body>
</html>
