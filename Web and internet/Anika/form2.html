<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <p><b><i>Figure 6-7</i></b> sample HTML form</p>
        <table>
            <tr>
                <td>Username:</td>
                <td><input type="text" name="" id="" size="30"></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="text" name="" id="" size="30"></td>
            </tr>
            <tr>
                <td>City of <br> Employment:</td>
                <td><input type="text" name="" id="" size="30"></td>
            </tr>
            <tr>
                <td>Web serber:</td>
                <td>
                    <select name="" id="">
                        <option value="">Choose a server</option>
                        <option value="">Human Resources</option>
                        <option value="">Development</option>
                        <option value="">Accounting</option>
                        <option value="">Sales</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Please specify <br>
                    your role:
                </td>
                <td>
                    <input type="radio">
                    <label>Admin</label><br>
                    <input type="radio">
                    <label>Engineer</label><br>
                    <input type="radio">
                    <label>Manager</label><br>
                    <input type="radio">
                    <label>Guest</label>

                </td>
            </tr>
            <tr>
                <td>
                    Single Sign-on <br>
                    to the following:
                </td>
                <td>
                    <input type="checkbox">
                    <label>Mail</label><br>
                    <input type="checkbox">
                    <label>Payroll</label><br>
                    <input type="checkbox">
                    <label>Self-service</label>

                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Login" name="" id="">
                    <input type="submit" value="reset" name="" id="">
                </td>
            </tr>
        </table>
    </form>
    <audio controls>
        <!-- <source src="horse.ogg" type="audio/ogg"> -->
        <source src="horse.mp3" type="audio/mpeg">
        Your browser does not support the audio tag.
    </audio>
    <video width="320" height="240" controls>
        <source src="movie.mp4" type="video/mp4">
        <!-- <source src="movie.ogg" type="video/ogg"> -->
        Your browser does not support the video tag.
    </video>
</body>

</html>
