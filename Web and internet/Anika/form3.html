<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Your Details:</legend>
            <label>Name:</label>
            <input type="text" size="30"><br>
            <label for="">Email:</label>
            <input type="email" size="30">
        </fieldset><br>
        <fieldset>
            <legend>Your Review:</legend>
            <label for="">How did you hear about us?</label>
            <select name="" id="">
                <option value="">Google</option>
                <option value="">Chrome</option>
                <option value="">You tube</option>
            </select><br><br>
            <label for="">Would you vist again?</label><br>
            <input type="radio">
            <label for="">Yes</label>
            <input type="radio">
            <label for="">No</label>
            <input type="radio">
            <label for="">Maybe</label>
            <br><br>
            <label for="">Comments:</label><br>
            <textarea name="" id="" rows="5" cols="40"></textarea><br><br>
            <input type="checkbox">
            <label for="">Sign me up for email updates</label>
            <br>
            <input type="submit" value="Submit review">
        </fieldset>
    </form>
</body>
</html>
