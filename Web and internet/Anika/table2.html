<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <table border="1">
        <tr style="background-color: aqua; align-items: center;">
            <th>Device</th>
            <th>Brand</th>
            <th colspan="3">Specifications</th>
        </tr>
        <tr>
            <td rowspan="3">Smartphone</td>
            <td rowspan="3">Apple</td>
            <td colspan="2" style="background-color: yellow; text-align: center;">Model</td>
            <td style="background-color: yellow; text-align: center;">Storage</td>
        </tr>
        <tr>
            <td colspan="2">iPhone 12 Pro</td>
            <td>256GB</td>
        </tr>
        <tr>
            <td colspan="2">iPhone SE</td>
            <td>128GB</td>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>HP</td>
            <td colspan="3">15.6" Display</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>Samsung</td>
            <td colspan="3">10.5" Display</td>
        </tr>
    </table>
</body>
</html>
