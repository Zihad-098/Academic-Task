<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Hello</p>
    <p>How are you ?</p>
    <p>Welcome to javaScript</p>
    <script>
        const paragraph = document.getElementsByTagName("p");
        paragraph[0].innerHTML = "First paragraph change ";
        paragraph[1].innerHTML = "Second paragraph change";
        paragraph[2].innerHTML = "Third paragraph change";
    </script>
</body>
</html>
