<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- user theke jeta ney seta hochhe post method -->
    <form action="submit.html" method="get">
        <input type="text" name="Query" id="Query" placeholder="Enter your name">
        <!-- <input type="submit" value="Search"> -->
         <label for="Username">Username</label><br>
         
         <input type="email" name="nail" id="mail" value="Email" placeholder="Enter your email">
         <label for="Email">Email</label><br>

         <input type="date" name="dob" id="dob" value="DOB">
         <label for="dob">Date of Birth</label><br>

         <input type="number" name="num" id="num" min="15" max="60">
         <label for="num">Age</label>


         <p>Gender:</p>
         <input type="radio" name="gender" id="male" value="Male">
         <label for="male">Male</label>
         <input type="radio" name="gender" id="female" value="Female">
         <label for="female">Female</label>

         
         <p>select your skills:</p>
         <input type="checkbox" name="html" id="html" value="HTML">
         <label for="html">HTML</label>
         <input type="checkbox" name="css" id="css" value="CSS">
         <label for="css">CSS</label>

         <input type="checkbox" name="bootstrap" id="bootstrap" value="BootStrap">
         <label for="bootstrap">BootStrap</label>

         <p></p>
         <label for="department">Department</label>
         <select name="department" id="department">
            <option value="CSE">CSE</option>
            <option value="EEE">EEE</option>
            <option value="ME">ME</option>
         </select>
    </form>
</body>
</html>
