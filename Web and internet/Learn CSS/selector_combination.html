<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            color: green;
        }
        div > p {
            font-size: 50%;
        }
        div + p { 
        /* addagence seblings  er meaning hochhe div er immediate jeta ache seta niye se kaj korbe */
            color: green;
        }
        div ~ p {
            color: yellow;
        }
    </style>
</head>
<body>
    <h1>This is H1</h1>
    <div>
        <p>This is paragraph 1</p>
        <p>This is paragraph 2</p>
        <p>This is paragraph 3</p>
        <p>This is paragraph 4</p>

    </div>
    <p>Lorem ipsum dolor sit amet.</p>
</body>
</html>
