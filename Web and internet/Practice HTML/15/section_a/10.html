<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Routine</title>
    <style>
        table,th,td {
            border: 1px,solid,black;
            /* border-collapse: collapse; */
            text-align: center;
        }
        table {
            border-collapse: collapse;
        }

    </style>
</head>
<body>
    <table>
        <caption>Class Routine</caption>
        <thead>
            <tr>
                <th>Day</th>
                <th>9-10 AM</th>
                <th>10-11 AM</th>
                <th>11-12 AM</th>
                <th>12-1 AM</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sunday</td>
                <td>CSE101</td>
                <td>CSE102</td>
                <td>Math</td>
                <td rowspan="3">Break</td>
            </tr>
            <tr>
                <td>Monday</td>
                <td>CSE103</td>
                <td>English</td>
                <td>CSE101</td>
            </tr>
            <tr>
                <td>Tuesday</td>
                <td>Math</td>
                <td>CSE102</td>
                <td>CSE103</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
