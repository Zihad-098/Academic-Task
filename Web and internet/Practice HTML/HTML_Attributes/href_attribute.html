<!-- The href attribute in HTML, used with the <a> tag, specifies a link destination. Clicking the linked text navigates to this address. Adding `target="_blank"` opens it in a new tab. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <a href="https://www.geeksforgeeks.org/html/html-attributes/">Click the link</a>

    <br>
    <a href="https://www.geeksforgeeks.org/html/html-attributes/" target="_blank">click the link</a>
</body>
</html>
